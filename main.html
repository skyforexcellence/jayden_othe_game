<script>
// AI 分析面板拖拽功能
var draggedElement = null;
var offsetX = 0;
var offsetY = 0;

function startDrag(e, elementId) {
	draggedElement = document.getElementById(elementId);
	offsetX = e.clientX - draggedElement.offsetLeft;
	offsetY = e.clientY - draggedElement.offsetTop;
	document.addEventListener('mousemove', drag);
	document.addEventListener('mouseup', stopDrag);
	e.preventDefault();
}

function drag(e) {
	if (draggedElement) {
		var newX = e.clientX - offsetX;
		var newY = e.clientY - offsetY;
		
		// 限制在視窗內
		var maxX = window.innerWidth - draggedElement.offsetWidth;
		var maxY = window.innerHeight - draggedElement.offsetHeight;
		
		newX = Math.max(0, Math.min(newX, maxX));
		newY = Math.max(0, Math.min(newY, maxY));
		
		draggedElement.style.left = newX + 'px';
		draggedElement.style.top = newY + 'px';
	}
}

function stopDrag() {
	document.removeEventListener('mousemove', drag);
	document.removeEventListener('mouseup', stopDrag);
	draggedElement = null;
}

// 添加關閉按鈕功能
document.addEventListener('DOMContentLoaded', function() {
	// 為 AI 分析面板添加關閉按鈕
	var aiPanel = document.getElementById('aiAnalysisPanel');
	if (aiPanel) {
		var closeBtn = document.createElement('div');
		closeBtn.innerHTML = '✖';
		closeBtn.style.cssText = 'position: absolute; top: 2px; right: 5px; cursor: pointer; font-size: 14px; color: #721c24; font-weight: bold;';
		closeBtn.onclick = function() {
			aiPanel.style.display = 'none';
		};
		aiPanel.appendChild(closeBtn);
	}
});
</script>
